[package]
name = "rustdx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.89"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustdx_complete = { package = "jelven-rustdx-complete", path = "../../crates/rustdx-core" }

[workspace]
members = ["."]

[[bin]]
name = "checked_parsers"
path = "fuzz_targets/checked_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modern_parsers"
path = "fuzz_targets/modern_parsers.rs"
test = false
doc = false
bench = false
