[package]
name = "rustdx-runner"
version = "2.0.4"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Bounded single-host collection ledger and immutable publication controller"

[dependencies]
rustdx-complete = { package = "jelven-rustdx-complete", path = "../../crates/rustdx-core" }
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
sha2 = "0.10"
csv = "1.4"
argh = "0.1"
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
rustdx-cli = { package = "jelven-rustdx-cli", path = "../rustdx-cli" }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
miniz_oxide = "0.9"
