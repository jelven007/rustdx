name: rustdx-acceptance

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
    ports:
      - "127.0.0.1:18123:8123"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse.xml:/etc/clickhouse-server/config.d/acceptance.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2g
    cpus: 2
  mongodb:
    image: mongo:8.0.16@sha256:4b58ebcb1dc7a7b4e84cd8ce9098d48764ae4478876898ff9551acf2ac4a6a6d
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok?0:1)"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 1g
    cpus: 2
