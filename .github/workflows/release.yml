name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUSTDX_SKIP_INTEGRATION_TESTS: "1"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: rustdx-linux
            binary: rustdx
          - os: macos-latest
            name: rustdx-macos
            binary: rustdx
          - os: windows-latest
            name: rustdx-windows.exe
            binary: rustdx.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build -p rustdx-cli --release --locked
      - name: Stage binary
        shell: bash
        run: cp target/release/${{ matrix.binary }} target/release/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.name }}

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - name: Create checksums
        run: cd binaries && sha256sum rustdx-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: binaries/*
