name: Data coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.89.0"
      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Check evidence horizon
        run: cargo run --locked -p jelven-rustdx-cli -- --no-tcp-startup data-status --warn-days 90 --report data-coverage.json --strict
      - name: Audit maintenance responsibilities and declared evidence
        if: always()
        run: python3 scripts/validation/audit_fact_maintenance.py --registry config/maintenance/facts.example.json --evidence-root . --output fact-maintenance.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: data-coverage
          path: |
            data-coverage.json
            fact-maintenance.json
