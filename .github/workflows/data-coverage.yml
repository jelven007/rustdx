name: Data coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: swatinem/rust-cache@v2
      - name: Check evidence horizon
        run: cargo run --locked -p jelven-rustdx-cli -- data-status --warn-days 90 --report data-coverage.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-coverage
          path: data-coverage.json
