name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      baseline:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTDX_SKIP_INTEGRATION_TESTS: "1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Version policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python3 scripts/release/versioning.py check
      - name: Reject local increments on PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/release/versioning.py check-pr --base "$BASE_REF"

  databases:
    name: Databases
    uses: ./.github/workflows/database-acceptance.yml
    with:
      revision: ${{ inputs.revision || github.sha }}

  test:
    name: Build / Test (${{ matrix.os }})
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_args: ""
          - os: macos-latest
            package_args: ""
          - os: windows-latest
            # The runner requires Unix process groups and persistent local storage.
            package_args: "--exclude rustdx-runner"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Build (all targets)
        # Match cargo test's profile instead of retaining a second full set of binaries.
        run: cargo build --profile test --workspace ${{ matrix.package_args }} --all-targets --all-features --locked

      - name: Repeated idle heartbeat failure and reconnect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($iteration in 1..10) {
            Write-Output "Idle heartbeat recovery iteration $iteration"
            cargo test -p jelven-rustdx-complete --test modern_commands --all-features --locked `
              idle_failure_invalidates_and_next_request_reconnects_without_mixing_sessions -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Diagnose file cache contention (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test -p jelven-rustdx-complete --lib --all-features --locked `
            cache::tests::parallel_file_reads_observe_complete_atomic_replacements -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jelven-rustdx-complete --lib --all-features --locked `
            cache::tests::independent_processes_share_one_file_capacity_limit -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: cargo test --workspace ${{ matrix.package_args }} --all-features --locked --no-fail-fast

      - name: Repeated process group cancellation regression (Unix)
        if: runner.os != 'Windows'
        run: |
          for iteration in $(seq 1 100); do
            cargo test -p rustdx-runner --lib --locked \
              database_process::tests::cancellation_and_deadline_kill_blocked_pipe_and_descendants \
              -- --exact --nocapture || exit $?
          done

      - name: Runner CLI and local fault regressions (Unix)
        if: runner.os != 'Windows'
        env:
          RUSTDX_TEST_CLI: ${{ github.workspace }}/target/debug/rustdx
          RUSTDX_TEST_CH_USER: default
          RUSTDX_TEST_CH_PASSWORD: ""
        run: >-
          cargo test -p rustdx-runner --test control_plane --locked --
          --include-ignored
          --skip real_databases_isolate_versions_reject_extra_keys_and_restore_local_evidence

  quality:
    name: Format / Clippy / Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.89.0"
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: python3 scripts/validation/check_documentation.py
      - run: python3 scripts/validation/check_documentation_lifecycle.py

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.89.0"
      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo test --workspace --all-features --locked

  contracts:
    name: Behavior / Consumers / Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.89.0"
      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
      - name: Pool, cache, calendar and adjustment behavior regressions
        run: cargo test -p jelven-rustdx-complete --lib --locked
      - name: Offline evidence, retention and benchmark comparison regressions
        run: python3 -m unittest discover -s scripts/validation/tests -v
      - name: Record external tests that were not executed
        run: python3 scripts/validation/run_online_tests.py --output "$RUNNER_TEMP/online-inventory"
      - name: Standalone current and legacy signature consumers
        run: python3 scripts/release/check_consumers.py --output "$RUNNER_TEMP/source-consumers"
      - name: Actual package extraction and downstream consumption
        run: >-
          python3 scripts/release/preflight.py
          --output "$RUNNER_TEMP/package-preflight" --skip-workspace-checks
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: contracts-${{ inputs.revision || github.sha }}
          path: |
            ${{ runner.temp }}/source-consumers/*.json
            ${{ runner.temp }}/online-inventory/online-tests.json
            ${{ runner.temp }}/source-consumers/*.log
            ${{ runner.temp }}/package-preflight/preflight.json
            ${{ runner.temp }}/package-preflight/*.log
            ${{ runner.temp }}/package-preflight/target/package/*.crate
            ${{ runner.temp }}/package-preflight/signature-consumers/*.json
            ${{ runner.temp }}/package-preflight/signature-consumers/*.log

  fuzz:
    name: Parser fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: tools/fuzz
      - name: Verify the synchronized fuzz lock
        run: cargo metadata --locked --format-version 1 > /dev/null
        working-directory: tools/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Build pinned real-frame and semantic-boundary seeds
        run: python3 scripts/validation/build_fuzz_seeds.py --output-directory tools/fuzz/corpus
      - name: Checked parser smoke fuzzing
        run: cargo fuzz run checked_parsers --fuzz-dir . -- -seed=20261027 -max_total_time=30 -max_len=65536
        working-directory: tools/fuzz
      - name: Modern command and refresh decoder smoke fuzzing
        run: cargo fuzz run modern_parsers --fuzz-dir . -- -seed=20261027 -max_total_time=30 -max_len=65536
        working-directory: tools/fuzz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: parser-fuzz-${{ inputs.revision || github.sha }}
          path: |
            tools/fuzz/corpus/
            tools/fuzz/artifacts/

  performance:
    name: Same-host indicator regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.89.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Compare shared batch APIs against base commit on this runner
        env:
          BASE_REF: ${{ inputs.baseline || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-parse HEAD^)"
          fi
          python3 scripts/bench/run_indicator_comparison.py \
            --baseline-ref "$BASE_REF" --output "$RUNNER_TEMP/indicator-comparison"
      - name: Indicator benchmark observation
        if: always()
        run: cargo bench -p jelven-rustdx-complete --bench indicators --locked > indicator-benchmark.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: indicator-benchmark-${{ inputs.revision || github.sha }}
          path: |
            indicator-benchmark.json
            ${{ runner.temp }}/indicator-comparison/*.json
            ${{ runner.temp }}/indicator-comparison/*.log
            ${{ runner.temp }}/indicator-comparison/input.f64le
            ${{ runner.temp }}/indicator-comparison/baseline/Cargo.lock
            ${{ runner.temp }}/indicator-comparison/baseline/Cargo.toml
            ${{ runner.temp }}/indicator-comparison/baseline/src/
            ${{ runner.temp }}/indicator-comparison/current/Cargo.lock
            ${{ runner.temp }}/indicator-comparison/current/Cargo.toml
            ${{ runner.temp }}/indicator-comparison/current/src/
