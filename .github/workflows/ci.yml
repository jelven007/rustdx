name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDX_SKIP_INTEGRATION_TESTS: "1"

permissions:
  contents: read

jobs:
  test:
    name: Build / Test / Clippy
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package_args: ""
          - os: macos-latest
            package_args: ""
          - os: windows-latest
            # The runner requires Unix process groups and persistent local storage.
            package_args: "--exclude rustdx-runner"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build (all targets)
        run: cargo build --workspace ${{ matrix.package_args }} --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace ${{ matrix.package_args }} --all-features --locked

      - name: Runner CLI and local fault regressions (Unix)
        if: runner.os != 'Windows'
        env:
          RUSTDX_TEST_CLI: ${{ github.workspace }}/target/debug/rustdx
          RUSTDX_TEST_CH_USER: default
          RUSTDX_TEST_CH_PASSWORD: ""
        run: >-
          cargo test -p rustdx-runner --test control_plane --locked --
          --include-ignored
          --skip real_databases_isolate_versions_reject_extra_keys_and_restore_local_evidence

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace ${{ matrix.package_args }} --all-targets --all-features --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Checked parser smoke fuzzing
        run: cargo fuzz run checked_parsers -- -max_total_time=30 -max_len=4096

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Indicator benchmark observation
        run: cargo bench --bench indicators --locked > indicator-benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: indicator-benchmark
          path: indicator-benchmark.txt
